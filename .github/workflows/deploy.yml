name: Deploy to GCE

# INTERIM 2026-09-29 (PO): push-deploy desactivado — SSH a watcher-prod falla
# (gcloud.compute.ssh key propagation / firewall / IAP / OS Login).
# Ticket: vault wiki board/stories/story-watcher-fix-deploy-ssh (id watcher-fix-deploy-ssh).
# Solo workflow_dispatch hasta fix. Para reactivar auto-deploy tras SSH verde, restaurar
# el bloque workflow_run comentado abajo.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI - Watcher Agent"]
  #   branches: [main]
  #   types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Con solo workflow_dispatch no hay workflow_run; if legacy se omite.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via SSH
        run: |
          gcloud compute ssh germanevangelisti@watcher-prod \
            --zone=us-central1-a \
            --command="bash -c '
              REPO_DIR=\$HOME/watcher
              if [ -d \$REPO_DIR/.git ]; then
                cd \$REPO_DIR && git fetch origin main && git reset --hard origin/main
              else
                rm -rf \$REPO_DIR
                git clone --depth 1 --branch main https://github.com/germanevangelisti/watcher.git \$REPO_DIR
                cd \$REPO_DIR
              fi
              bash scripts/deploy.sh
            '"

      - name: Health check
        run: |
          echo "Waiting 30s for containers to start..."
          sleep 30
          for i in $(seq 1 5); do
            if curl -sf http://34.170.135.94/api/v1/health; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
